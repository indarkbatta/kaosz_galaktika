name: Editor template browser regression
on:
  pull_request:
    paths:
      - 'src/components/EditorTemplate.tsx'
      - 'src/CrewEditor.tsx'
      - 'src/crew-editor.css'
      - 'src/editor.css'
      - 'tools/qa/editor-template-browser.mjs'
      - 'tools/qa/build-crew-preview.mjs'
      - '.github/workflows/editor-template-browser.yml'
permissions:
  contents: read
jobs:
  template-browser:
    runs-on: self-hosted
    timeout-minutes: 15
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install application dependencies
        run: npm install --no-fund --no-audit
      - name: Install pinned browser tools
        run: npm install --prefix "%RUNNER_TEMP%\\hatarvilag-editor-browser-tools" --no-save --no-fund --no-audit playwright@1.56.1
      - name: Install Chromium and Firefox
        run: node "%RUNNER_TEMP%\\hatarvilag-editor-browser-tools\\node_modules\\playwright\\cli.js" install chromium firefox
      - name: Compare Crew Editor with the shared template
        env:
          EDITOR_BROWSER_TOOLS: ${{ runner.temp }}\\hatarvilag-editor-browser-tools
        run: node tools/qa/editor-template-browser.mjs
