name: Species Homeworld browser regression
on:
  pull_request:
    paths:
      - 'src/Editor.tsx'
      - 'src/editor.css'
      - 'tools/qa/species-homeworld-*'
      - '.github/workflows/species-homeworld-browser.yml'
permissions:
  contents: read
jobs:
  species-homeworld:
    runs-on: self-hosted
    timeout-minutes: 15
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-fund --no-audit
      - name: Install browser tools
        run: npm install --prefix "%RUNNER_TEMP%\hatarvilag-homeworld-browser-tools" --no-save --no-fund --no-audit playwright@1.56.1
      - name: Install Chromium and Firefox
        run: node "%RUNNER_TEMP%\hatarvilag-homeworld-browser-tools\node_modules\playwright\cli.js" install chromium firefox
      - name: Validate species Homeworld picker
        env:
          HOMEWORLD_BROWSER_TOOLS: ${{ runner.temp }}\hatarvilag-homeworld-browser-tools
        run: node tools/qa/species-homeworld-browser.mjs
