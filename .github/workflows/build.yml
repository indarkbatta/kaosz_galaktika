name: Határvilág — build check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: self-hosted
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm install --no-fund --no-audit
      - name: Typecheck and build
        run: npm run build
